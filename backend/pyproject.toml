[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libra-panel"
version = "0.1.0"
description = "Panel del dueño multisucursal: los números de N sucursales en una pantalla, preguntándoselos por HTTP."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # `SessionAuth` + `UserRepository` + `build_json_api_auth_router` (el login
    # del CLIENTE, con tabla `usuarios`, recupero por mail y `auth_log`), y
    # `crypto.cifrar/descifrar` para las credenciales de sucursal en reposo.
    #
    # 🔴 v0.29.0 no es un pin de rutina: es la version que trae
    # `LIBRA_PANEL_TOKEN` / `X-Panel-Auth`. Este repo es el consumidor del OTRO
    # lado de ese header — el que lo manda. Bajarlo deja al panel sin forma de
    # autenticarse contra ninguna sucursal.
    #
    # v0.40.0: el captcha ALTCHA del login y del forgot-password
    # (`captcha=True`, ADR-014), y desde v0.39.0 la IP real del bloqueo por
    # intentos (`ip_del_request`) detras del proxy.
    # v0.48.0 -> v0.49.0 (2026-10-12): `registrador_dbapi` y el formato del log en funciones puras (ADR-022). Sin migracion.
    # v0.49.0 -> v0.50.0 (2026-10-13): varios procesos (ADR-023): `UsadosEnBase` para el captcha (tabla `libraauth_captcha_usados`, migracion `0003`) y `AdminAuth` con `flock` sobre el JSON de estado.
    # v0.50.0 -> v0.51.0 (2026-10-15, ADR-024): el responsable acepta por adelantado la proxima version de los Terminos (`GET /terminos` suma `proxima`, `POST /aceptar` acepta la vigente o la proxima). Sin migracion; el aviso pide libra-ui v0.153.0.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.51.0",
    # Solo por `security_headers`, que es lo que hace que los seis productos y
    # el backoffice manden las mismas cabeceras. Se pinea igual que el resto de
    # la familia aunque el panel no use nada mas de este motor: el dia que
    # cambien las cabeceras, cambian en todos a la vez.
    #
    # NO se usa `libracore.admin` ni `provisioning`: el panel no administra
    # instancias ni toca Docker. Por eso su imagen no lleva el cliente de
    # Docker, a diferencia de la de libra-backoffice.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.148.0 -> v1.149.0 (2026-10-09): en una demo (`DEMO_MODE=1`) la empresa es siempre ficticia (`config_manager`, ADR-038 de libracore). Fuera de una demo no cambia nada. Sin migracion.
    # v1.149.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    # v1.152.0 -> v1.153.0 (2026-10-10): sucursales contratadas y abono por unidad adicional (`libracore.limites` y `libracore.abono`, ADR-041). Sin dato de sucursales contratadas no limita nada; este producto no lo usa. Sin migracion.
    # v1.153.0 -> v1.154.0 (2026-10-12): `libracore.cuit.solo_digitos` y se retira `cc_resumen` (codigo muerto, nadie lo usaba). Sin migracion.
    # v1.154.0 -> v1.155.0 (2026-10-12): migracion 0024 retira cc_resumenes_enviados y clients.cc_resumen_* (ADR-042). Desplegar el producto ANTES de migrar.
    # v1.155.0 -> v1.157.0 (2026-10-12): `libracore.auditoria` (ADR-043): las escrituras de clients avisan a un registrador, apagado si el producto no lo configura. v1.156.0 es un tag erroneo, no usar. Sin migracion.
    # v1.157.0 -> v1.159.0 (2026-10-13): `libracore.candados` (ADR-044) y `libracore.errores` (ADR-045): registro de errores propio, una linea JSON por 500 en `errores.jsonl`. Sin migracion.
    # v1.159.0 -> v1.162.0 (2026-10-13): concepto sin «Factura» doble con migracion 0025 (corre al migrar, backup antes), alta por CLI con aviso de casilla y `panel_admin casilla`, se retira `get_cc_movimientos_periodo` y los adicionales quedan fuera de la escalera de planes (ADR-048, sin migracion).
    # v1.163.0 -> v1.164.0 (2026-10-14): cada envio por mail de un comprobante o un presupuesto deja rastro (`envios_email`, ADR-050 de libracore): `GET .../{id}/envios`, `envios_email` en el detalle y `envio_email` en el listado. **Migracion `0026_envios_email`** (tabla nueva) en la cadena de `libracore-migrar`.
    # v1.164.0 -> v1.166.0 (2026-10-14): incluye v1.165.0 (un proceso sin el almacen de secretos dice la causa) y `GET /api/facturas?envio=enviada|sin_enviar` filtra el listado por el rastro de envios por mail (ADR-051 de libracore). Sin migracion.
    # v1.167.0 -> v1.168.0 (2026-10-15, propuesta; ADR-053 de libracore): `libracore.docs_api.cerrar_docs_de_la_api`: `/docs`, `/redoc` y `/openapi.json` sólo con `ENV=development` (o `LIBRA_DOCS_API=1`); en un cliente real y en la demo dan 404. Sin migracion. `uv.lock` se regenera cuando exista el tag.
    # v1.168.0 -> v1.170.0 (2026-10-15): v1.169.0 suma `fk_de_producto.soltar_fk` (ADR-056; sin efecto en este producto, la usa LibraDesk) y v1.170.0 hace que `delete_client` bloquee la baja de un cliente con cuenta corriente (`cc_pagos`, `cc_debitos`, `recibos` y `cc_asientos` con rol cliente; ADR-057): desactivarlo en vez de borrarlo. Sin migracion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.171.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # El panel le habla a cada sucursal por HTTP, en paralelo y con timeout.
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0",
    # PostgreSQL es el unico motor de la familia (decidido 2026-08-12). psycopg
    # 3, que es el driver de la familia — ver la guarda de `db.configure()`.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.13",
    # Trae el plugin de pytest que corre los tests `async def`. Sin el, los
    # tests de las N llamadas en paralelo se saltearian con un warning y la
    # suite quedaria verde sin haberlos ejecutado — el mismo cuidado que toma
    # libra-backoffice.
    "anyio>=4",
    "pytest-xdist>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["libra_panel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# La zona horaria de la suite se fija en `tests/conftest.py` (TZ + `tzset()`) y
# no se hereda de la maquina: el panel calcula "hoy" y "el mes en curso" para
# el periodo por defecto, y una maquina en UTC hace que el primer y el ultimo
# dia del mes den distinto en local que en CI. Estandar de la familia desde el
# 2026-08-12. Se hace en el conftest y no aca para no sumar `pytest-env`.

# Mismo ruleset curado que los otros repos de la familia (fijado 2026-07-31):
# da cero hallazgos hoy, asi que cualquier rojo futuro es una regresion real y
# no deuda vieja. F401 queda afuera a proposito -- los re-exports de
# `__init__.py` son API publica, no imports muertos.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F811",
    "F822",
    "F823",
    "F841",
    "F541",
    "F502", "F506", "F522", "F524",
    "F601", "F602",
]

[tool.coverage.run]
source = ["libra_panel"]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
# Trinquete, no meta: se fija 3 puntos por debajo de lo medido al crearse el
# repo, asi que hoy pasa holgado y lo unico que puede ponerlo en rojo es una
# regresion. Cuando la cobertura suba de verdad, subir tambien este numero --
# nunca bajarlo para que pase un cambio.
fail_under = 91
